[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Privacy-preserving Graph-Hybrid RAG for relationship-aware codebase understanding"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Orchestration
    "llama-index>=0.10.0",
    "llama-index-graph-stores-falkordb>=0.1.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-ollama>=0.1.0",
    "llama-index-llms-ollama>=0.1.0",

    # AST parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-java>=0.21.0",

    # Vector / Graph clients
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",          # FalkorDB uses Redis protocol

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Evaluation
    "ragas>=0.1.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",           # CLI output
    "typer>=0.12.0",          # CLI commands
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",          # FastAPI test client
]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live FalkorDB, Qdrant, and Ollama services",
]
