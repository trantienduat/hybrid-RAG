services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
      - "8008:3000" # FalkorDB Browser UI
    environment:
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - NEXTAUTH_SECRET=super_secret_nextauth_string_12345
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 5

  hybrid-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-rag-api
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - QDRANT_HOST=qdrant
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - FALKORDB_GRAPH=$FALKORDB_GRAPH
      - LLM_MODEL=qwen2.5-coder:7b
      - REDIS_HOST=falkordb
      - TRACING_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/Kioxia_SSD/SSD_workspace/Personal:/codebases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  hybrid-rag-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-rag-mcp
    command: ["hybrid-rag", "mcp", "--transport", "sse", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - FALKORDB_HOST=falkordb
      - QDRANT_HOST=qdrant
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - FALKORDB_GRAPH=$FALKORDB_GRAPH
      - LLM_MODEL=qwen2.5-coder:7b
      - REDIS_HOST=falkordb
      - TRACING_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/Kioxia_SSD/SSD_workspace/Personal:/codebases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"   # Web UI / HTTP OTLP collector
      - "4317:4317"   # gRPC OTLP collector
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - hybrid-rag-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  falkordb_data:
  qdrant_data:
  phoenix_data:
  prometheus_data:
  grafana_data:

