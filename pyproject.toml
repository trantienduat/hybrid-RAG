[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.4.0"
description = "Privacy-preserving Graph-Hybrid RAG for relationship-aware codebase understanding"
requires-python = ">=3.12,<3.14"
dependencies = [
    # AST parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-java>=0.21.0",

    # Vector / Graph clients
    "qdrant-client>=1.9.0",
    "falkordb>=1.6.0",

    # Embedding / LLM (local via Ollama)
    "httpx>=0.27.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",           # CLI output
    "typer>=0.12.0",          # CLI commands
    "networkx>=3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
eval = [
    "ragas==0.4.3",
    "langchain-community==0.4.1",
]
mcp = [
    "mcp>=0.1.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "arize-phoenix>=4.0.0",
]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hybrid_rag.api" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live FalkorDB, Qdrant, and Ollama services",
]
