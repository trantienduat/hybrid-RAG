name: Production Release Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,mcp]
          
      - name: Run Pytest
        run: |
          pytest tests/ -v -m "not integration"

  build-and-publish:
    name: Build & Publish Docker Image
    needs: test
    # Only build and publish on push/merge/tag events, not on open pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 1. Generate SemVer tags on release tags (e.g. v0.2.0 -> 0.2.0)
            type=semver,pattern={{version}}
            # 2. Tag as 'latest' on pushes to stable main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 3. Tag as 'develop' on pushes to develop branch (Industry-standard dev tag)
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # 4. Generate a unique short-sha tag for exact commit traceability (GitOps standard)
            type=sha,prefix=sha-
            
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
