<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hybrid-rag — Graph Explorer</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2e3148;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --accent:  #6366f1;
      --accent2: #22d3ee;
      --green:   #34d399;
      --yellow:  #fbbf24;
      --red:     #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1  { font-size: 14px; color: var(--accent); letter-spacing: 0.05em; }
    header .sub { color: var(--muted); font-size: 11px; flex: 1; }
    .badge-local {
      font-size: 10px;
      background: rgba(52,211,153,0.12);
      color: var(--green);
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 3px;
      padding: 2px 8px;
    }

    /* ── 3-panel layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Left sidebar ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section { padding: 10px; border-bottom: 1px solid var(--border); }
    .sidebar-section label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    input[type=text] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      margin-top: 6px;
      width: 100%;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Results list ── */
    .results-list { flex: 1; overflow-y: auto; padding: 6px; }
    .result-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .result-item:hover  { background: var(--border); }
    .result-item.active { border-color: var(--accent); background: rgba(99,102,241,0.12); }
    .result-item .name { color: var(--text); font-weight: 600; font-size: 11px; }
    .result-item .meta { color: var(--muted); font-size: 10px; margin-top: 1px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* ── Label badges ── */
    .label-badge    { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; margin-right: 3px; }
    .label-Class    { background: rgba(99,102,241,0.25); color: var(--accent); }
    .label-Function { background: rgba(34,211,238,0.20); color: var(--accent2); }
    .label-Module   { background: rgba(52,211,153,0.20); color: var(--green); }
    .label-Variable { background: rgba(251,191,36,0.20); color: var(--yellow); }

    /* ── Graph canvas ── */
    .canvas-wrap {
      flex: 1;
      min-width: 280px;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    #graph-3d { width: 100%; height: 100%; }
    /* 3d-force-graph tooltip override */
    .graph-tooltip {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      padding: 6px 10px !important;
      font-size: 11px !important;
      font-family: 'SF Mono', Consolas, monospace !important;
      color: var(--text) !important;
    }
    .g-tip-label { color: var(--muted); font-size: 10px; }
    .g-tip-path  { color: var(--muted); font-size: 10px; margin-top: 2px; word-break: break-all; }

    /* ── Graph overlays ── */
    .empty-state {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center; color: var(--muted); pointer-events: none;
    }
    .empty-state p { margin-top: 6px; font-size: 12px; }
    .status-bar {
      position: absolute; top: 8px; left: 8px;
      background: rgba(26,29,39,0.92);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px; color: var(--muted);
    }
    .legend {
      position: absolute; bottom: 12px; right: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px; font-size: 10px;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Chat panel ── */
    .chat-panel {
      width: 420px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }
    .chat-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      padding: 2px 8px;
      margin: 0;
      width: auto;
      cursor: pointer;
      border-radius: 3px;
    }
    .btn-clear:hover { background: var(--border); }

    /* ── Messages ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-empty { color: var(--muted); font-size: 12px; text-align: center; margin: auto; }
    .msg-user      { align-self: flex-end;   max-width: 88%; }
    .msg-assistant { align-self: flex-start; max-width: 100%; }
    .msg-role { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .msg-user .msg-role { text-align: right; }
    .msg-body {
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.55;
      font-size: 12px;
      word-break: break-word;
    }
    .msg-user      .msg-body { background: rgba(99,102,241,0.14); border: 1px solid rgba(99,102,241,0.25); }
    .msg-assistant .msg-body { background: var(--bg); border: 1px solid var(--border); }
    .msg-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .msg-user .msg-meta { text-align: right; }

    /* ── Citations ── */
    .citations { margin-top: 6px; }
    .citations > summary {
      font-size: 10px; color: var(--muted); cursor: pointer;
      padding: 2px 0; list-style: none; user-select: none;
    }
    .citations > summary::before { content: '▶  '; }
    .citations[open] > summary::before { content: '▼  '; }
    .citations-body { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
    .citation-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 10px;
    }
    .citation-name  { color: var(--text); font-weight: 600; margin-right: 4px; }
    .citation-score { color: var(--green); float: right; }
    .citation-path  { color: var(--muted); margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* ── Code blocks (highlight.js) ── */
    .code-block {
      position: relative;
      margin: 6px 0;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .code-lang { position: absolute; right: 6px; top: 4px; font-size: 9px; color: var(--muted); pointer-events: none; }
    .code-block pre { margin: 0; overflow-x: auto; }
    .code-block code.hljs { font-size: 11px; padding: 10px 12px; border-radius: 0; }
    code:not(.hljs) { background: rgba(255,255,255,0.07); padding: 1px 4px; border-radius: 3px; font-size: 11px; }

    /* ── Chat input bar ── */
    .chat-input-bar {
      flex-shrink: 0;
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .chat-input-bar textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      resize: none;
      min-height: 38px;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.4;
    }
    .chat-input-bar textarea:focus { border-color: var(--accent); }
    .chat-input-bar button { width: auto; margin: 0; padding: 8px 16px; flex-shrink: 0; }

    /* ── Streaming cursor ── */
    .cursor {
      display: inline-block;
      width: 2px; height: 12px;
      background: var(--accent);
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

<header>
  <h1>hybrid-rag</h1>
  <span class="sub">Knowledge Graph Explorer + RAG Query</span>
  <span class="badge-local">🔒 Local</span>
</header>

<div class="layout">

  <!-- ── Left: search sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-section">
      <label for="searchInput">Search KG Nodes</label>
      <input type="text" id="searchInput" placeholder="e.g. BaseRetriever" />
      <button id="searchBtn" type="button">Search</button>
    </div>
    <div class="results-list" id="resultsList">
      <div style="color:var(--muted);padding:8px;font-size:11px;">
        Search for a node to explore the graph.
      </div>
    </div>
  </div>

  <!-- ── Centre: 3-D knowledge graph ── -->
  <div class="canvas-wrap" id="canvasWrap">
    <div id="graph-3d"></div>

    <div class="empty-state" id="emptyState">
      <span style="font-size:32px;opacity:0.3">⬡</span>
      <p>Select a node from the search results<br>to visualise its relationships.</p>
    </div>

    <div class="status-bar" id="statusBar" style="display:none" aria-live="polite"></div>

    <div class="legend">
      <div class="legend-row"><div class="legend-dot" style="background:rgba(99,102,241,0.85)"></div>Class</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(34,211,238,0.85)"></div>Function</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(52,211,153,0.85)"></div>Module</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(251,191,36,0.85)"></div>Variable</div>
    </div>
  </div>

  <!-- ── Right: chat panel ── -->
  <div class="chat-panel">
    <div class="chat-header">
      <span>Ask the Codebase</span>
      <button class="btn-clear" id="clearBtn" type="button">Clear</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty">Ask anything about the indexed codebase…</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="questionInput"
                placeholder="e.g. Which classes inherit from BaseRetriever? (Enter ↵ to send, Shift+Enter for newline)"
                rows="1"></textarea>
      <button id="askBtn" type="button">Ask</button>
    </div>
  </div>

</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const API = '';  // relative — FastAPI serves the static file

const LABEL_COLORS = {
  Class:    'rgba(99,102,241,0.9)',
  Function: 'rgba(34,211,238,0.9)',
  Module:   'rgba(52,211,153,0.9)',
  Variable: 'rgba(251,191,36,0.9)',
};

// ── State ─────────────────────────────────────────────────────────────────────

let currentNodeId  = null;
let graphInstance  = null;   // ForceGraph3D instance
let currentAsk     = null;   // AbortController for the in-flight stream
let statusTimer    = null;   // auto-clear timer for status bar
const messages     = [];     // { id, role, text, sources, latency, streaming }
let msgIdCounter   = 0;

// ── DOM refs ──────────────────────────────────────────────────────────────────

const searchInput   = document.getElementById('searchInput');
const searchBtn     = document.getElementById('searchBtn');
const resultsList   = document.getElementById('resultsList');
const questionInput = document.getElementById('questionInput');
const askBtn        = document.getElementById('askBtn');
const clearBtn      = document.getElementById('clearBtn');
const chatMessages  = document.getElementById('chatMessages');
const emptyState    = document.getElementById('emptyState');
const statusBar     = document.getElementById('statusBar');

// ── Search ────────────────────────────────────────────────────────────────────

// Event delegation — no inline onclick (XSS prevention)
resultsList.addEventListener('click', e => {
  const item = e.target.closest('.result-item');
  if (!item) return;
  selectNode(item.dataset.id, item.dataset.label, item.dataset.name);
});

searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  searchBtn.textContent = '…';
  try {
    const r = await fetch(`${API}/graph/search?q=${encodeURIComponent(q)}&limit=20`);
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    renderResultsList(data.nodes);
  } catch (err) {
    resultsList.innerHTML = `<div role="alert" style="color:var(--red);padding:8px;font-size:11px;">Error: ${escHtml(err.message)}</div>`;
  } finally {
    searchBtn.textContent = 'Search';
  }
}

function renderResultsList(nodes) {
  if (!nodes.length) {
    resultsList.innerHTML = '<div style="color:var(--muted);padding:8px;font-size:11px;">No nodes found.</div>';
    return;
  }
  resultsList.innerHTML = nodes.map(n => `
    <div class="result-item"
         data-id="${escHtml(n.id)}"
         data-label="${escHtml(n.label)}"
         data-name="${escHtml(n.name)}">
      <div class="name">
        <span class="label-badge label-${escHtml(n.label)}">${escHtml(n.label)}</span>
        ${escHtml(n.name || n.id.split('::').pop().split('.').pop())}
      </div>
      <div class="meta">${escHtml(n.file_path)}</div>
    </div>
  `).join('');
}

// ── Node selection → 3-D graph ────────────────────────────────────────────────

async function selectNode(nodeId, label, name) {
  if (nodeId === currentNodeId) return;
  currentNodeId = nodeId;

  document.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.result-item[data-id="${CSS.escape(nodeId)}"]`);
  if (el) el.classList.add('active');

  showStatus(`Loading neighbors of ${name}…`);
  emptyState.style.display = 'none';

  try {
    const r = await fetch(`${API}/graph/neighbors/${encodeURIComponent(nodeId)}?direction=both&limit=40`);
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    renderGraph(nodeId, label, name, data.neighbors);
    showStatus(`${data.neighbors.length} neighbors · click node to expand`);
  } catch (err) {
    showStatus(`Error: ${err.message}`);
  }
}

// ── 3-D Force Graph ───────────────────────────────────────────────────────────

function renderGraph(anchorId, anchorLabel, anchorName, edges) {
  const nodeMap = new Map();
  const addNode = (id, lbl, nm, fp, isAnchor) => {
    if (!nodeMap.has(id)) nodeMap.set(id, { id, label: lbl, name: nm, file_path: fp || '', isAnchor });
  };

  addNode(anchorId, anchorLabel, anchorName, '', true);
  edges.forEach(e => addNode(e.dst_id, e.dst_label, e.dst_name, e.dst_file_path, false));

  const gData = {
    nodes: [...nodeMap.values()],
    links: edges.map(e => ({ source: e.src_id, target: e.dst_id, rel: e.rel })),
  };

  const container = document.getElementById('graph-3d');
  const wrap      = document.getElementById('canvasWrap');

  if (!graphInstance) {
    graphInstance = ForceGraph3D()(container)
      .backgroundColor('#0f1117')
      .nodeLabel(n => {
        const nm  = escHtml(n.name || n.id.split('::').pop().split('.').pop());
        const lbl = escHtml(n.label);
        const fp  = n.file_path ? `<div class="g-tip-path">${escHtml(n.file_path)}</div>` : '';
        return `<div><strong>${nm}</strong><div class="g-tip-label">${lbl}</div>${fp}</div>`;
      })
      .nodeColor(n  => LABEL_COLORS[n.label] || '#8892a4')
      .nodeVal(n    => n.isAnchor ? 6 : 2)
      .nodeOpacity(0.9)
      .linkColor(()  => '#4b5280')
      .linkLabel(l   => l.rel)
      .linkWidth(1)
      .linkDirectionalArrowLength(4)
      .linkDirectionalArrowRelPos(1)
      .linkDirectionalParticles(1)
      .linkDirectionalParticleWidth(1)
      .width(wrap.clientWidth)
      .height(wrap.clientHeight)
      .onNodeClick(n => { if (!n.isAnchor) selectNode(n.id, n.label, n.name); });
  }

  graphInstance.graphData(gData);
}

// Resize 3-D canvas when container size changes
new ResizeObserver(() => {
  if (graphInstance) {
    const wrap = document.getElementById('canvasWrap');
    graphInstance.width(wrap.clientWidth).height(wrap.clientHeight);
  }
}).observe(document.getElementById('canvasWrap'));

// ── Chat — message history ────────────────────────────────────────────────────

function pushMessage(role, text, sources = [], latency = null, streaming = false) {
  const id = ++msgIdCounter;
  messages.push({ id, role, text, sources, latency, streaming });
  renderMessages();
  return id;
}

function renderMessages() {
  if (!messages.length) {
    chatMessages.innerHTML = '<div class="chat-empty">Ask anything about the indexed codebase…</div>';
    return;
  }
  chatMessages.innerHTML = messages.map(renderMessage).join('');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderMessage(m) {
  const isUser   = m.role === 'user';
  const bodyHtml = isUser
    ? escHtml(m.text)
    : (m.streaming ? escHtml(m.text) : renderMarkdown(m.text));
  const cursor  = m.streaming ? '<span class="cursor"></span>' : '';
  const sources = (!isUser && m.sources && m.sources.length) ? renderCitations(m.id, m.sources) : '';
  const latency = m.latency ? `<div class="msg-meta">${m.latency}s</div>` : '';
  return `
    <div class="msg msg-${m.role}" id="msg-${m.id}">
      <div class="msg-role">${isUser ? 'You' : 'Assistant'}</div>
      <div class="msg-body" id="msg-body-${m.id}">${bodyHtml}${cursor}</div>
      ${sources}${latency}
    </div>`;
}

function renderCitations(msgId, sources) {
  const items = sources.slice(0, 8).map(s => {
    let parts = (s.node_id || '').split('::');
    if (parts.length > 1 && /^\d+$/.test(parts[parts.length - 1])) {
      parts.pop();
    }
    let canonical = parts.pop() || '';
    const shortName = s.name || canonical.split('.').pop() || s.node_id;
    return `
      <div class="citation-item">
        <span class="label-badge label-${escHtml(s.label)}">${escHtml(s.label)}</span>
        <span class="citation-name">${escHtml(shortName)}</span>
        <span class="citation-score">${s.score != null ? (s.score * 100).toFixed(0) + '%' : ''}</span>
        <div class="citation-path">${escHtml(s.file_path || '')}</div>
      </div>`;
  }).join('');
  return `
    <details class="citations" id="cite-${msgId}">
      <summary>${sources.length} source${sources.length > 1 ? 's' : ''}</summary>
      <div class="citations-body">${items}</div>
    </details>`;
}

// ── Markdown → HTML (safe; LLM output only) ───────────────────────────────────

function renderMarkdown(raw) {
  if (!raw) return '';
  const parts = [];
  let last = 0;
  const fence = /```(\w*)\n([\s\S]*?)```/g;
  let m;
  while ((m = fence.exec(raw)) !== null) {
    if (m.index > last) parts.push({ type: 'text', content: raw.slice(last, m.index) });
    parts.push({ type: 'code', lang: m[1] || null, content: m[2] });
    last = m.index + m[0].length;
  }
  if (last < raw.length) parts.push({ type: 'text', content: raw.slice(last) });

  return parts.map(p => {
    if (p.type === 'code') {
      const lang        = p.lang && hljs.getLanguage(p.lang) ? p.lang : null;
      const highlighted = lang
        ? hljs.highlight(p.content.trimEnd(), { language: lang }).value
        : escHtml(p.content.trimEnd());
      const langBadge   = p.lang ? `<span class="code-lang">${escHtml(p.lang)}</span>` : '';
      return `<div class="code-block">${langBadge}<pre><code class="hljs">${highlighted}</code></pre></div>`;
    }
    return escHtml(p.content)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,     '<em>$1</em>')
      .replace(/`([^`]+)`/g,     '<code>$1</code>')
      .replace(/\n/g,            '<br>');
  }).join('');
}

// ── Ask / SSE streaming ───────────────────────────────────────────────────────

askBtn.addEventListener('click', doAsk);
questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAsk(); }
});

// Auto-grow textarea
questionInput.addEventListener('input', () => {
  questionInput.style.height = 'auto';
  questionInput.style.height = Math.min(questionInput.scrollHeight, 140) + 'px';
});

// Clear chat history
clearBtn.addEventListener('click', () => {
  messages.length = 0;
  renderMessages();
});

async function doAsk() {
  const q = questionInput.value.trim();
  if (!q) return;

  // Abort any in-flight request
  if (currentAsk) { currentAsk.abort(); }
  currentAsk = new AbortController();
  askBtn.disabled = true;
  questionInput.value = '';
  questionInput.style.height = 'auto';

  // Add user message immediately
  pushMessage('user', q);

  // Placeholder assistant message (streaming state)
  const assistantId = ++msgIdCounter;
  messages.push({ id: assistantId, role: 'assistant', text: '', sources: [], latency: null, streaming: true });
  renderMessages();

  const t0 = performance.now();
  let streamBuf       = '';
  let capturedSources = [];

  try {
    const resp = await fetch(`${API}/query/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 20, context_n: 5, stream: true }),
      signal: currentAsk.signal,
    });
    if (!resp.ok) throw new Error(await resp.text());

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let lineBuf    = '';
    let firstEvent = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      lineBuf += decoder.decode(value, { stream: true });

      const lines = lineBuf.split('\n');
      lineBuf = lines.pop();   // keep incomplete last line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));

          if (firstEvent) {
            // First event carries sources + query_type metadata
            firstEvent      = false;
            capturedSources = ev.sources || [];
            continue;
          }

          if (ev.token) streamBuf += ev.token;

          // Live update — only the streaming message body (no full re-render on each token)
          const bodyEl = document.getElementById(`msg-body-${assistantId}`);
          if (bodyEl) {
            bodyEl.innerHTML = escHtml(streamBuf) + '<span class="cursor"></span>';
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }

          if (ev.done) {
            const latency = ((performance.now() - t0) / 1000).toFixed(2);
            const entry   = messages.find(x => x.id === assistantId);
            if (entry) {
              Object.assign(entry, {
                text: streamBuf, sources: capturedSources, latency, streaming: false,
              });
            }
            renderMessages();   // final render: markdown + citations
          }
        } catch (_) {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      const entry = messages.find(x => x.id === assistantId);
      if (entry) Object.assign(entry, { text: `Error: ${err.message}`, streaming: false });
      renderMessages();
    }
  } finally {
    currentAsk = null;
    askBtn.disabled = false;
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function showStatus(msg) {
  statusBar.style.display = 'block';
  statusBar.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusBar.style.display = 'none'; }, 5000);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
